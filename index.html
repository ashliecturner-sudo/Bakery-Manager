<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="colored-logo.png">
  <link rel="apple-touch-icon" href="colored-logo.png">
  <title>Ashlie Bakes Cakes - Commercial Bakery Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #faf7f2; -webkit-tap-highlight-color: transparent; }
    .font-serif-title { font-family: 'Playfair Display', serif; }
    .nav-tab.active { background-color: #7c2d12; color: #ffffff; border-color: #7c2d12; }
    .sub-tab.active { border-bottom: 3px solid #b45309; color: #b45309; font-weight: 700; }
    .tin-toggle.active { background-color: #b45309; color: #ffffff; font-weight: 700; border-color: #b45309; }
    @media (max-width: 640px) {
      input, select, textarea { font-size: 16px !important; }
      .nav-tab { padding: 8px 12px !important; font-size: 12px !important; }
      .modal-box { margin: 8px !important; max-height: 92vh !important; padding: 16px !important; }
      table { min-width: 540px; }
    }
    button, select, input[type="checkbox"], input[type="button"] { min-height: 42px; touch-action: manipulation; }
  </style>
</head>
<body class="min-h-screen text-stone-800 flex flex-col">

  <!-- TOP HEADER -->
  <header class="bg-stone-900 text-stone-100 shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <img src="colored-logo.png" alt="Logo" class="w-10 h-10 rounded-full object-cover border border-amber-500/40 shadow" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='flex';">
        <div id="fallbackLogo" class="w-10 h-10 rounded-full bg-amber-600 hidden items-center justify-center text-white text-xl font-bold font-serif-title shadow">🎂</div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white font-serif-title">Ashlie Bakes Cakes</h1>
          <p class="text-xs text-amber-200">Commercial Bakery Manager & Cloud Hub</p>
        </div>
      </div>

      <!-- Quick Action Stats & Cloud Indicator -->
      <div class="flex items-center space-x-2 sm:space-x-3 text-xs">
        <button id="cloudSyncHeaderBtn" onclick="switchTab('settings')" class="bg-stone-800 border border-stone-700 text-amber-300 px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1 shadow-sm transition hover:bg-stone-700" title="Google Sheets Cloud Status">
          <span>☁️</span> <span id="cloudHeaderLabel">Cloud Ready</span>
        </button>
        <div id="lowStockHeaderBadge" class="hidden cursor-pointer bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-full font-semibold flex items-center gap-1 shadow transition" onclick="switchTab('inventory')">
          <span>⚠️</span> <span id="lowStockCountText">0 low</span>
        </div>
        <button onclick="switchTab('import')" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg font-medium shadow flex items-center gap-1.5 transition">
          <span>📥</span> Import
        </button>
        <button onclick="openNewRecipeModal()" class="bg-stone-800 hover:bg-stone-700 border border-stone-600 text-stone-200 px-3 py-1.5 rounded-lg font-medium shadow transition">
          + New
        </button>
      </div>
    </div>

    <!-- MAIN APP NAVIGATION -->
    <div class="bg-stone-800 border-t border-stone-700">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 flex space-x-1 overflow-x-auto text-sm py-1.5">
        <button onclick="switchTab('recipes')" id="tabBtn-recipes" class="nav-tab active px-4 py-2 rounded-lg font-medium whitespace-nowrap transition">📖 Recipes & Formulas</button>
        <button onclick="switchTab('baking')" id="tabBtn-baking" class="nav-tab px-4 py-2 rounded-lg font-medium text-stone-300 hover:bg-stone-700 whitespace-nowrap transition">👩‍🍳 I Am Baking!</button>
        <button onclick="switchTab('inventory')" id="tabBtn-inventory" class="nav-tab px-4 py-2 rounded-lg font-medium text-stone-300 hover:bg-stone-700 whitespace-nowrap transition">📦 Raw Ingredients Stock</button>
        <button onclick="switchTab('shed')" id="tabBtn-shed" class="nav-tab px-4 py-2 rounded-lg font-medium text-stone-300 hover:bg-stone-700 whitespace-nowrap transition">🏡 Shed & B2B Inventory</button>
        <button onclick="switchTab('import')" id="tabBtn-import" class="nav-tab px-4 py-2 rounded-lg font-medium text-stone-300 hover:bg-stone-700 whitespace-nowrap transition">📄 Import Document</button>
        <button onclick="switchTab('settings')" id="tabBtn-settings" class="nav-tab px-4 py-2 rounded-lg font-medium text-stone-300 hover:bg-stone-700 whitespace-nowrap transition">⚙️ Google Sheets Sync</button>
      </div>
    </div>
  </header>

  <!-- MAIN BODY CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full">

    <!-- ==================== TAB 1: RECIPES & FORMULAS ==================== -->
    <section id="tab-recipes" class="space-y-6">
      <div id="recipeHeaderBar" class="flex flex-wrap justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-stone-200">
        <div class="flex flex-wrap items-center gap-4">
          <div class="flex items-center gap-2">
            <label class="font-bold text-stone-700 text-xs uppercase">Recipe:</label>
            <select id="recipeSelect" onchange="loadSelectedRecipe()" class="border border-stone-300 bg-stone-50 rounded-lg px-3 py-2 text-xs font-bold text-stone-900 focus:ring-2 focus:ring-amber-500 outline-none min-w-[200px]"></select>
          </div>
          <div id="recipeFlavourWrapper" class="flex items-center gap-2">
            <label class="font-bold text-stone-700 text-xs uppercase">Flavour:</label>
            <div class="flex items-center gap-1.5">
              <select id="recipeFlavourSelect" onchange="changeFlavourSelection()" class="border border-amber-300 bg-amber-50 rounded-lg px-3 py-2 text-xs font-bold text-amber-950 focus:ring-2 focus:ring-amber-500 outline-none min-w-[190px]"></select>
              <button onclick="openAddFlavourModal()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-2.5 py-2 rounded-lg font-bold shadow transition flex items-center gap-1" title="Add flavour">
                <span>➕</span> Flavour
              </button>
            </div>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button onclick="openEditRecipeModal()" class="text-xs text-stone-800 bg-stone-100 hover:bg-stone-200 border border-stone-300 px-3 py-2 rounded-lg font-bold transition flex items-center gap-1 shadow-sm">
            <span>✏️</span> Edit Recipe
          </button>
          <button onclick="openManageFlavoursModal()" class="text-xs text-amber-900 bg-amber-100 hover:bg-amber-200 px-3 py-2 rounded-lg font-semibold transition">Manage Flavours</button>
          <button onclick="deleteCurrentRecipe()" class="text-xs text-red-600 hover:text-red-800 px-3 py-2 border border-red-200 rounded-lg bg-red-50 hover:bg-red-100 transition">Delete</button>
          <button onclick="openBakeFromCurrentRecipe()" class="bg-amber-700 hover:bg-amber-600 text-white text-xs px-4 py-2 rounded-lg font-bold shadow transition">Bake This Now →</button>
        </div>
      </div>

      <div id="emptyRecipeState" class="hidden bg-white p-12 text-center rounded-2xl border-2 border-dashed border-stone-300 space-y-4">
        <div class="text-5xl">🧁</div>
        <h3 class="text-xl font-bold text-stone-800 font-serif-title">No Recipes Saved Yet</h3>
        <p class="text-sm text-stone-600 max-w-md mx-auto">Upload an existing recipe document or create a commercial recipe.</p>
        <div class="flex justify-center gap-4 pt-2">
          <button onclick="switchTab('import')" class="bg-amber-700 hover:bg-amber-600 text-white px-5 py-2.5 rounded-xl font-semibold shadow transition text-sm">Import Recipe File</button>
          <button onclick="openNewRecipeModal()" class="bg-stone-800 hover:bg-stone-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow transition text-sm">+ Write Recipe</button>
        </div>
      </div>

      <div id="activeRecipeContainer" class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
        <div class="bg-gradient-to-r from-stone-900 to-stone-800 text-white p-6">
          <div class="flex flex-wrap justify-between items-start gap-4">
            <div>
              <div class="flex items-center gap-2">
                <span id="recipeCategoryBadge" class="bg-amber-600/30 text-amber-300 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-amber-500/30 uppercase tracking-wider">Commercial Formula</span>
                <span id="activeFlavourTag" class="bg-emerald-600/30 text-emerald-300 text-xs px-2.5 py-0.5 rounded-full font-semibold border border-emerald-500/30">Plain / Base (No Inclusions)</span>
              </div>
              <h2 id="recipeTitle" class="text-2xl sm:text-3xl font-bold font-serif-title mt-2">Recipe Title</h2>
              <div class="flex flex-wrap items-center gap-2 mt-3 text-xs">
                <span class="text-stone-300 font-bold uppercase tracking-wider text-[11px]">Tin Size Preset:</span>
                <div id="tinToggleButtonsGroup" class="flex flex-wrap items-center bg-stone-800 p-1 rounded-lg border border-stone-700 gap-1"></div>
                <button onclick="openAddTinSizeModal()" class="bg-stone-700 hover:bg-stone-600 text-amber-300 px-3 py-1 rounded text-xs font-bold border border-stone-600 transition flex items-
